name: 크리스 LITE APK (알림 수집 없음 · Play 프로텍트 통과)
#name: build-apk

# 크리스 앱 APK 빌드 (깃허브 서버에서 Flutter/안드로이드 SDK로 빌드)
# push 때마다, 또는 수동 실행(Actions 탭 Run workflow)으로 APK를 만든다.
# 결과물: Actions 실행 > Artifacts > kris-app-apk (app-release.apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 자바(JDK 17) 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          # flutter_inappwebview 6.1.x 와 호환되는 Gradle/AGP 조합으로 고정
          flutter-version: '3.24.5'
          channel: stable

      - name: 내 소스 백업
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp lib/main.dart /tmp/main.dart

      - name: 안드로이드 스캐폴딩 생성
        run: flutter create --platforms=android --org com.ohwantbalance --project-name kris_app .

      - name: 내 소스 복원
        run: |
          cp /tmp/pubspec.yaml pubspec.yaml
          cp /tmp/main.dart lib/main.dart

      # ★LITE 2026-10-18 팀장 — 구글 Play 프로텍트(한국 사기방지 강화)가 ★알림 접근(NotificationListener) 앱을 설치 자체 차단.
      #   교육생 설치용은 알림 수집 플러그인을 ★같은 이름의 빈 껍데기(스텁)로 바꿔 빌드한다. 앱 알림 수집은 「보조」, 손(PC)이 본체.
      - name: LITE — 알림 수집 플러그인을 스텁으로
        run: |
          mkdir -p notif_stub/lib
          cat > notif_stub/pubspec.yaml <<'EOF2'
          name: flutter_notification_listener_plus
          version: 0.0.1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          EOF2
          cat > notif_stub/lib/flutter_notification_listener_plus.dart <<'EOF2'
          // LITE 스텁 — 알림 수집 없음. 같은 API 이름만 유지해 main.dart 를 안 고친다.
          class NotificationEvent {
            final String? packageName; final String? title; final String? text; final DateTime? createAt;
            NotificationEvent({this.packageName, this.title, this.text, this.createAt});
          }
          class NotificationsListener {
            static Future<void> initialize({Function? callbackHandle}) async {}
            static Future<bool?> get hasPermission async => false;
            static Future<bool?> get isRunning async => false;
            static Future<void> startService({bool foreground = false, String title = '', String description = ''}) async {}
            static Future<void> stopService() async {}
            static Future<void> openPermissionSettings() async {}
          }
          EOF2
          python3 - <<'PY'
          import re
          p='pubspec.yaml'; s=open(p).read()
          s=re.sub(r'^\s*flutter_notification_listener_plus:.*$', '  flutter_notification_listener_plus:\n    path: ./notif_stub', s, flags=re.M)
          open(p,'w').write(s)
          PY
          grep -n -A1 "flutter_notification_listener_plus" pubspec.yaml

      - name: 안드로이드 설정 패치 (권한 + 앱이름 + minSdk)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          add_perm() {
            grep -q "\"$1\"" "$MF" || \
              sed -i "s#<application#<uses-permission android:name=\"$1\"/>\n    <application#" "$MF"
          }
          add_perm android.permission.INTERNET
          add_perm android.permission.FOREGROUND_SERVICE
          add_perm android.permission.FOREGROUND_SERVICE_DATA_SYNC
          add_perm android.permission.POST_NOTIFICATIONS
          add_perm android.permission.RECEIVE_BOOT_COMPLETED
          add_perm android.permission.READ_MEDIA_AUDIO
          add_perm android.permission.READ_EXTERNAL_STORAGE
          sed -i 's#android:label="[^"]*"#android:label="크리스"#' "$MF"
          # ★알림 읽기 서비스(NotificationListenerService) 선언 — ★이게 있어야 "알림 접근 허용" 목록에 크리스가 뜬다 (2026-10-17 팀장)
          # LITE — 알림 읽기 서비스 ★안 넣음 (Play 프로텍트 차단 사유)
          echo "----- Manifest -----"; sed -n '1,30p' "$MF"
          echo "----- service 확인(없어야 정상) -----"; grep -n "NotificationsHandlerService\|BIND_NOTIFICATION_LISTENER" "$MF" && echo "★★LITE 인데 service 있음" && exit 1 || echo "service 없음 OK"
          # minSdk 23 (secure_storage·notification listener 호환)
          AG=android/app/build.gradle
          sed -i 's#minSdkVersion flutter.minSdkVersion#minSdkVersion 23#' "$AG" 2>/dev/null || true
          sed -i 's#minSdk = flutter.minSdkVersion#minSdk = 23#' "$AG" 2>/dev/null || true
          sed -i 's#minSdk flutter.minSdkVersion#minSdk 23#' "$AG" 2>/dev/null || true
          echo "----- build.gradle minSdk -----"; grep -n "minSdk" "$AG" || true
          # Kotlin 2.1.0 (flutter_notification_listener_plus 1.4.0 의 stdlib 2.1.0 호환)
          SG=android/settings.gradle
          sed -i -E 's#(org\.jetbrains\.kotlin\.android" version )"[0-9.]+"#\1"2.1.0"#' "$SG" 2>/dev/null || true
          echo "----- settings.gradle kotlin -----"; grep -n "kotlin.android" "$SG" || true

      - name: 서명 열쇠 고정 (★판 279b — 빌드마다 새 열쇠면 폰에서 「앱이 설치되지 않음」, 업데이트가 안 됨)
        run: |
          mkdir -p ~/.android
          cp keys/kris-sign.keystore ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i "SHA" | head -1 || true

      - name: 서명 열쇠를 gradle 에 직접 지정 (★판 279d — ~/.android 복사만으로는 안 먹어 빌드마다 서명이 달랐음)
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            printf '\nandroid {\n  signingConfigs {\n    getByName("debug") {\n      storeFile = rootProject.file("../keys/kris-sign.keystore")\n      storePassword = "android"\n      keyAlias = "androiddebugkey"\n      keyPassword = "android"\n    }\n  }\n}\n' >> android/app/build.gradle.kts
          else
            printf '\nandroid {\n  signingConfigs {\n    debug {\n      storeFile rootProject.file("../keys/kris-sign.keystore")\n      storePassword "android"\n      keyAlias "androiddebugkey"\n      keyPassword "android"\n    }\n  }\n}\n' >> android/app/build.gradle
          fi
          tail -12 android/app/build.gradle* 

      - name: 의존성 받기
        run: flutter pub get

      - name: APK 빌드(release)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --dart-define=KRIS_LITE=true 2>&1 | tee /tmp/build.log

      - name: 서명 확인 (열쇠와 다르면 실패)
        if: steps.build.outcome == 'success'
        run: |
          WANT=$(keytool -list -v -keystore keys/kris-sign.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          GOT=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "열쇠 $WANT"; echo "APK  $GOT"
          [ "$WANT" = "$GOT" ] || { echo "::error::서명이 고정 열쇠와 다릅니다"; exit 1; }

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: warn

      - name: APK 업로드(Artifact)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: kris-app-lite-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: APK를 릴리스로 발행(발주자 다운로드용)
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk kris-app.apk
          gh release delete app-lite -y --cleanup-tag 2>/dev/null || true
          gh release create app-lite kris-app.apk \
            --title "크리스 앱 LITE (교육생 설치용 · Play 프로텍트 통과)" \
            --notes "교육생 설치용 LITE — 알림 수집 없음(Play 프로텍트 차단 회피). 커밋 ${{ github.sha }}"

      - name: 빌드 실패 시 에러를 주석으로 노출
        if: steps.build.outcome != 'success'
        run: |
          echo "----- build.log tail -----"
          tail -60 /tmp/build.log || true
          echo "----- 핵심 에러를 annotation으로 -----"
          # 진행바(\r)·다운로드 잡음 제거
          sed 's/\r/\n/g' /tmp/build.log \
            | grep -vaiE "unzipping|downloading|%\]|^\[|^\s*$" > /tmp/clean.log || true
          # 'What went wrong' / 'FAILURE' 블록을 문맥째로
          # ★컴파일 에러를 먼저(가장 유용), GitHub는 스텝당 주석 10개 제한
          grep -aE "^e: |\.kt:|\.java:|error:|unresolved|only available since|incompatible|requires|This version of|was compiled with" /tmp/clean.log \
            | grep -aivE "warning|note:|--warning|deprecat" | head -7 \
            | while IFS= read -r l; do echo "::error::KT ${l}"; done
          grep -aA 3 -E "What went wrong" /tmp/clean.log | head -3 \
            | while IFS= read -r l; do echo "::error::${l}"; done
          exit 1
