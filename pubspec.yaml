name: kris_app
description: "크리스 — 보험설계사 AI 비서 네이티브 앱 (기존 크리스 웹을 WebView로 띄우고, 폰 알림·통화·메일을 수집)"
publish_to: 'none'
version: 0.3.4+8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^9.2.2
  flutter_notification_listener_plus: ^1.3.7
  http: ^1.2.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
